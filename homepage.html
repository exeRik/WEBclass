<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PK WEBSITE</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;

        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        header {
            background-color: rgb(130, 121, 121);
            height: 45vh;
            display: flex;
            flex-direction: column;
        }

        li {
            list-style: none;
            padding: 20px;
        }

        ul {
            background-color: rgb(71, 55, 124);
            height: 10vh;
            /* background-image: linear-gradient(rgb(184, 160, 160), rgb(189, 79, 28)); */
            display: flex;
        }

        a {
            font-size: 4vh;
            text-decoration: none;
            text-align: center;
            color: rgb(255, 253, 253);
        }

        #navbar li:hover {
            background-color: rgb(202, 205, 205);
        }

        main {
            background-color: rgb(35, 169, 71);
            height: 50vh;
            display: flex;
            flex-direction: row;
        }

        .div1 {
            background-color: rgb(184, 212, 25);
            width: 30vw;
            height: 50vh;
        }

        .div2 {
            background-color: rgb(217, 61, 188);
            width: 40vw;
            height: 50vh;
        }

        .div3 {
            background-color: aqua;
            width: 30vw;
            height: 50vh;
        }

        footer {
            background-color: rgb(73, 136, 195);
            height: 10vh;
        }

        .slider-container {
            background-color: #607e7e;
            height: 50vh;
            width: 100%;
            overflow: hidden;
            /* Adjust width as needed */
            /* animation: slider 5s linear infinite; */
            /* position: relative; */
            /* Necessary for transform to take effect */
        }

        .slider {
            display: flex;
            /* Arrange images in a single row */
            gap: 0;
            /* No gaps between images */
            animation: slider 20s linear infinite;
            /* Smooth, infinite scrolling */
        }

        .slider img {
            height: 300px;
            /* Make images match container height */
            width: 900px;
            /* Maintain aspect ratio */
        }

        @keyframes slider {
            0% {
                transform: translateX(-100%);
                margin: 0px;
                /* Start off-screen on the left */
                /* opacity: 0; */
                /* Invisible at start */
            }

            /* 1% {
                opacity: 1;
                
            }

            95% {
                opacity: 1;
             
            } */

            100% {
                transform: translateX(100%);
                /* Move off-screen to the right */
                /* opacity: 0; */
                /* Fade out */
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="navbarclass">
            <ul id="navbar">
                <li><a href="#home">Home</ahref>
                </li>
                <li><a href="#about"> About</ahref>
                </li>
                <li><a href="#services"> Services</ahref>
                </li>
                <li><a href="#contact">Contact</ahref>
                </li>
                <ul>
        </div>

        <div class="slider-container">
            <div class="slider">
                <!-- <img src="images/build.jpg" alt="Image 1"> -->
                <img src="images/dance.jpg" alt="Image 2">
                <img src="images/foot.jpg" alt="Image 3">
                <img src="images/funcn.jpg" alt="Image 4">
                <img src="images/gatz.jpg" alt="Image 4">
                <img src="images/hm.jpg" alt="Image 4">
                <img src="images/lab.jpg" alt="Image 4">
                <img src="images/library.jpg" alt="Image 4">
                <img src="images/logo.jpg" alt="Image 4">
                <img src="images/pk gate.jpg" alt="Image 4">
                <img src="images/prog.jpg" alt="Image 4">
                <img src="images/puja.jpg" alt="Image 4">
                <img src="images/queen.jpg" alt="Image 4">
                <img src="images/saris.jpg" alt="Image 4">
                <img src="images/song.jpg" alt="Image 4">
                <img src="images/students.webp" alt="Image 4">

            </div>
        </div>

    </header>
    <main>
        <div class="div1">.</div>
        <div class="div2">.</div>
        <div class="div3">.</div>
    </main>
    <footer></footer>
</body>

</html>
